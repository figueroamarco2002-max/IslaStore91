<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Jr Store</title>
    <!-- ========== FAVICON ========== -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FFFFFF'/%3E%3Ctext x='30' y='70' font-family='Arial' font-size='70' font-weight='bold' fill='%230D0D0D' text-anchor='middle'%3EJ%3C/text%3E%3Ctext x='70' y='70' font-family='Arial' font-size='70' font-weight='bold' fill='%233D3D3D' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-very-dark: #0D0D0D;
            --color-dark: #3D3D3D;
            --color-medium: #6E6E6E;
            --color-light: #B6B6B6;
            --color-very-light: #FFFFFF;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: var(--color-very-light);
            color: var(--color-very-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #EDEDED;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 360px;
        }

        .login-card h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--color-very-dark);
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--color-very-dark);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--color-light);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            color: var(--color-very-dark);
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: var(--color-dark);
        }

        button {
            width: 100%;
            padding: 0.85rem;
            background: var(--color-very-dark);
            color: var(--color-very-light);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            transition: background 0.2s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background: var(--color-dark);
        }

        #error-msg {
            color: #d93025;
            display: none;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            background: #fdf2f2;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #f8b4b4;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Panel Admin</h2>
        <div id="error-msg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Correo electrónico</label>
                <input type="email" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('jrstore_admin_token', data.token);
                    localStorage.setItem('jrstore_admin_auth', 'true');
                    window.location.href = 'admin.html';
                } else {
                    errorEl.style.display = 'block';
                    errorEl.textContent = data.error || 'Credenciales incorrectas';
                }
            } catch (error) {
                console.error(error);
                errorEl.style.display = 'block';
                errorEl.textContent = 'Error de conexión con el servidor';
            }
        });
    </script>

</body>

</html>
