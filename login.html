<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jr Store | Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
    <div class="login-container">
        <h1>Iniciar Sesión</h1>
        <p>Área Administrativa</p>
        <div class="form-group" style="text-align: left; margin-top: 20px;">
            <label for="username">Usuario</label>
            <input type="text" id="username" placeholder="Ingresa 'admin'">
        </div>
        <div class="form-group" style="text-align: left;">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa 'admin'">
        </div>
        <p id="error-msg" style="color: red; display: none; font-size: 0.9rem;">Credenciales incorrectas.</p>
        <button class="login-btn" onclick="login()">Ingresar</button>
        <br><br>
        <a href="index.html" style="color: #666; font-size: 0.9rem; text-decoration: underline;">Volver a la tienda</a>
    </div>

    <script>
        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            if (user === 'admin' && pass === 'admin') {
                localStorage.setItem('jrstore_admin_auth', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // Si ya está logueado, redirigir
        if (localStorage.getItem('jrstore_admin_auth') === 'true') {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
