<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Jr Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-edit {
            background: #ffc107;
            color: black;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        /* Estilos de la Ventana Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background: white;
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Regla CSS para que los selectores se vean igual que los inputs */
        .modal input,
        .modal select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h2>Panel Admin - Jr Store</h2>
            <button class="btn btn-danger" onclick="logout()">Cerrar Sesión</button>
        </header>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Gestión de Productos</h3>
            <button class="btn btn-primary" onclick="openModal(false)">+ Añadir Producto</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>SKU</th>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="admin-product-list">
                <tr>
                    <td colspan="8">Cargando productos...</td>
                </tr>
            </tbody>
        </table>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 40px;">
            <h3>Mensajes de Contacto</h3>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Comentario</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="admin-contact-list">
                <tr>
                    <td colspan="7">Cargando mensajes...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Ventana Modal para Añadir/Editar Producto -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Añadir Producto</h3>
            <input type="hidden" id="prod-id">

            <label>Nombre:</label>
            <input type="text" id="prod-name" placeholder="Ej: Franela Oversize">

            <label>Precio ($):</label>
            <input type="number" step="0.01" id="prod-price" placeholder="Ej: 25.00">

            <label>Cantidad en stock:</label>
            <input type="number" step="1" min="0" id="prod-stock" placeholder="Ej: 5">

            <!-- NUEVO: Selector de Categoría -->
            <label>Categoría:</label>
            <select id="prod-cat" required>
                <option value="1">Hombre</option>
                <option value="2">Mujer</option>
            </select>

            <!-- NUEVO: Selector de Tipo de Prenda -->
            <label>Tipo de prenda:</label>
            <select id="prod-tipo" required>
                <option value="ropa">Ropa</option>
                <option value="gorra">Gorra</option>
                <option value="reloj">Reloj</option>
            </select>

            <label>Estilo:</label>
            <select id="prod-estilo" required>
                <option value="Urbano">Urbano</option>
                <option value="Deportivo">Deportivo</option>
            </select>

            <label>Descripción:</label>
            <input type="text" id="prod-type" placeholder="Breve descripción">

            <label>Imagen del producto:</label>
            <input type="file" id="prod-img-file" accept="image/*">

            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <button class="btn btn-primary" style="width: 48%;" onclick="saveProduct()">Guardar</button>
                <button class="btn btn-danger" style="width: 48%;" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        let products = [];

        // Lógica para abrir/cerrar el modal
        function openModal(isEdit) {
            if (!isEdit) {
                document.getElementById('modal-title').innerText = "Añadir Producto";
                document.getElementById('prod-id').value = '';
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';

                // Valores por defecto al abrir para añadir uno nuevo
                document.getElementById('prod-cat').value = '1';
                document.getElementById('prod-tipo').value = 'ropa';
                document.getElementById('prod-estilo').value = 'Urbano';
                document.getElementById('prod-stock').value = 1;

                document.getElementById('prod-type').value = '';
                document.getElementById('prod-img-file').value = '';
            }
            document.getElementById('product-modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        function logout() {
            localStorage.removeItem('jrstore_admin_token');
            localStorage.removeItem('jrstore_admin_auth');
            window.location.href = 'login.html';
        }

        async function renderAdminProducts() {
            const tbody = document.getElementById('admin-product-list');
            tbody.innerHTML = '<tr><td colspan="8">Cargando...</td></tr>';
            try {
                const token = localStorage.getItem('jrstore_admin_token');
                const response = await fetch(`${API_BASE_URL}/products`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Error al cargar productos');
                const data = await response.json();
                products = data;
                tbody.innerHTML = '';

                if (products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">No hay productos registrados.</td></tr>';
                    return;
                }

                products.forEach(p => {
                    const imagenSrc = p.imagen || p.image_url || 'https://placehold.co/50x50/eeeeee/999999?text=Sin+Img';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><img src="${imagenSrc}" alt="${p.name || p.nombre}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;"></td>
                        <td><strong>${p.sku || '-'}</strong></td>
                        <td>${p.id}</td>
                        <td>${p.name || p.nombre}</td>
                        <td>$${parseFloat(p.price || p.precio || 0).toFixed(2)}</td>
                        <td>${p.stock ?? 0}</td>
                        <td>${(p.category_id == 1 || p.category_name === 'Hombre') ? 'Hombre' : 'Mujer'}</td>
                        <td>
                            <button class="btn btn-edit" onclick="editProduct('${p.id}')">Editar</button>
                            <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="8" style="color:red; text-align:center;">Error al cargar productos</td></tr>';
            }
        }

        async function deleteProduct(id) {
            if (!confirm('¿Seguro que deseas eliminar este producto?')) return;
            try {
                const token = localStorage.getItem('jrstore_admin_token');
                const response = await fetch(`${API_BASE_URL}/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Error al eliminar');
                await renderAdminProducts();
            } catch (error) {
                console.error(error);
                alert('Error al eliminar producto');
            }
        }

        async function saveProduct() {
            const id = document.getElementById('prod-id').value;
            const name = document.getElementById('prod-name').value.trim();
            const price = parseFloat(document.getElementById('prod-price').value);
            const stock = parseInt(document.getElementById('prod-stock').value) || 0;
            const category_id = parseInt(document.getElementById('prod-cat').value);
            const tipo = document.getElementById('prod-tipo').value;
            const estilo = document.getElementById('prod-estilo').value;
            const description = document.getElementById('prod-type').value.trim();
            const fileInput = document.getElementById('prod-img-file');

            // Validaciones
            if (!name) {
                alert('El nombre es obligatorio');
                return;
            }
            if (isNaN(price) || price <= 0) {
                alert('Debes ingresar un precio válido mayor que 0');
                return;
            }

            // Construir FormData
            const formData = new FormData();
            formData.append('name', name);
            formData.append('price', price);
            formData.append('category_id', category_id);
            formData.append('tipo', tipo);
            formData.append('estilo', estilo);
            formData.append('description', description);
            formData.append('stock', stock);

            if (fileInput && fileInput.files[0]) {
                formData.append('image', fileInput.files[0]);
            }

            try {
                const token = localStorage.getItem('jrstore_admin_token');
                if (!token) {
                    alert('No hay sesión activa. Inicia sesión nuevamente.');
                    window.location.href = 'login.html';
                    return;
                }

                const url = id ? `${API_BASE_URL}/products/${id}` : `${API_BASE_URL}/products`;
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                let errorMsg = '';
                let responseData = null;
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    responseData = await response.json();
                    errorMsg = responseData.message || responseData.error || '';
                } else {
                    errorMsg = await response.text();
                }

                if (!response.ok) {
                    throw new Error(`[${response.status}] ${errorMsg || response.statusText}`);
                }

                await renderAdminProducts();
                closeModal();
                alert('✅ Producto guardado correctamente');
            } catch (error) {
                console.error('❌ Error al guardar:', error);
                alert(`Error al guardar producto:\n${error.message}`);
            }
        }

        async function editProduct(id) {
            try {
                const token = localStorage.getItem('jrstore_admin_token');
                const response = await fetch(`${API_BASE_URL}/products/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Producto no encontrado');
                const p = await response.json();

                document.getElementById('modal-title').innerText = "Editar Producto";
                document.getElementById('prod-id').value = p.id;
                document.getElementById('prod-name').value = p.name || p.nombre || '';
                document.getElementById('prod-price').value = p.price || p.precio || '';
                document.getElementById('prod-stock').value = p.stock ?? 0;

                // Categoría
                if (p.category_id == 1 || p.category_id == 2) {
                    document.getElementById('prod-cat').value = p.category_id;
                } else {
                    document.getElementById('prod-cat').value = '1';
                }

                // Tipo
                const tipoValid = (p.tipo || '').toLowerCase();
                if (['ropa', 'gorra', 'reloj'].includes(tipoValid)) {
                    document.getElementById('prod-tipo').value = tipoValid;
                } else {
                    document.getElementById('prod-tipo').value = 'ropa';
                }

                // Estilo
                if (p.estilo === 'Urbano' || p.estilo === 'Deportivo') {
                    document.getElementById('prod-estilo').value = p.estilo;
                } else {
                    document.getElementById('prod-estilo').value = 'Urbano';
                }

                document.getElementById('prod-type').value = p.description || '';

                openModal(true);
            } catch (error) {
                console.error(error);
                alert('Error al cargar producto para editar');
            }
        }

        // ================= MENSAJES DE CONTACTO =================
        async function renderAdminContacts() {
            const tbody = document.getElementById('admin-contact-list');
            tbody.innerHTML = '<tr><td colspan="7">Cargando...</td></tr>';
            try {
                const token = localStorage.getItem('jrstore_admin_token');
                const response = await fetch(`${API_BASE_URL}/contact`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Error al cargar mensajes');
                const contactos = await response.json();
                tbody.innerHTML = '';

                if (contactos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No hay mensajes.</td></tr>';
                    return;
                }

                contactos.forEach(c => {
                    const fecha = new Date(c.created_at).toLocaleString('es-VE', { dateStyle: 'short', timeStyle: 'short' });
                    const tr = document.createElement('tr');
                    if (!c.leido) tr.style.background = '#fff8e1';
                    tr.innerHTML = `
                        <td>${fecha}</td>
                        <td>${c.nombre}</td>
                        <td><a href="mailto:${c.correo}">${c.correo}</a></td>
                        <td>${c.telefono ? `<a href="https://wa.me/${c.telefono.replace(/\D/g, '')}" target="_blank">${c.telefono}</a>` : '-'}</td>
                        <td style="max-width:250px; white-space:normal;">${c.comentario}</td>
                        <td>${c.leido ? '✅ Leído' : '🟡 Nuevo'}</td>
                        <td>
                            ${!c.leido ? `<button class="btn btn-primary" onclick="marcarLeido('${c.id}')">Marcar leído</button>` : ''}
                            <button class="btn btn-danger" onclick="eliminarContacto('${c.id}')">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="7" style="color:red; text-align:center;">Error al cargar mensajes</td></tr>';
            }
        }

        async function marcarLeido(id) {
            try {
                const token = localStorage.getItem('jrstore_admin_token');
                await fetch(`${API_BASE_URL}/contact/${id}/leido`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                await renderAdminContacts();
            } catch (error) {
                console.error(error);
                alert('Error al actualizar el mensaje');
            }
        }

        async function eliminarContacto(id) {
            if (!confirm('¿Eliminar este mensaje?')) return;
            try {
                const token = localStorage.getItem('jrstore_admin_token');
                await fetch(`${API_BASE_URL}/contact/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                await renderAdminContacts();
            } catch (error) {
                console.error(error);
                alert('Error al eliminar el mensaje');
            }
        }

        // Comprobar autenticación al cargar
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('jrstore_admin_token');
            if (!token) {
                window.location.href = 'login.html';
            } else {
                renderAdminProducts();
                renderAdminContacts();
            }
        });
    </script>

</body>

</html>
